"What is xmap_sfc?": "module variable that holds the exchange grid between land, ice, and atmosphere"
"What is the register id for  'moisture scale'?": "id_q_star"
"What is in atm_land_ice_flux_exchange_mod?": "Module containing subroutines to exchange fluxes from atm to land and ice"
"Where is t_surf registered for diag_manager?": "when diag_field_init is called in atm_land_ice_flux_exchange_mod"
"How is the code different between using and not using the AM3_PHYS macro" : "TBD.  Need the scientist input. "
"What is _USE_LEGACY_LAND?": "TBD.  Need the scientist input (most likely have to do with modern unstructured land grid vs legacy structured land grid)"
"What does sfc_boundary_layer do?": "Computes and exchanges fluxes from atmosphere to land and ice "
"There are all these stock computations.  What is a stock and why are they needed?": "FMSCoupler keeps track of total amount of heat, water, and salt concentration(?) to check for mass and energy conservation "
"What do 'sg' and 'ug' suffixes stand for throughout this file?": "'sg = structured grid, ug = unstructured grid"
"What is diag_field_init?": "Subroutine in atm_ice_land_flux_exchange_mod to register diagnostic fields in diag_manager"
"What is flux_ex_arrays_dealloc?": "Subroutine to deallocate all module-level arrays that was allocated on the exchange grid in sfc_boundary_layer"
"Where is program main in a coupled model?": "In program coupler_main.F90"
"How do I specify the starting model time?": "Time_init, same for all restart runs, is set from the diag_table.yaml.  For a restart run, Time_start (Time at zeroth iteration), can be set from coupler.res or with the namelist "
"How do I specify the length of the runtime?": "Can set it with namelist variables months, days, hours, minutes, seconds "
"How do I restart a model?": "Does not have enough information to answer this question correctly.  Need to verify, but restart is handled by fre.  Without fre, the users need to copy RESTART/* to INPUT/"
"Do I need to set any namelist parameter to restart a run?": "Can set the current_date and force_date_from_namelist to set Time_start for a restart run.  Else, there is no explicit variable to start a run from RESTART files"
"What happens in the coupler?": "Long answer... Answer should mention advancing the model components "
"What happens in the fast loop?": "Long answer... Answer should mention atmosphere, fast land, and fast ice dynamics; flux exchange on the fast timescale "
"What happens in the slow loop?": "Long answer... Answer should mention ocean, slow land, and slow ice dynamics; flux exchange between these components on slow timescale "
"What is do_concurrent_radiation?": "Namelist parameter to turn on OpenMP parallelization to run radiation dynamics concurrently with the other fast processes in the fast time loop"
"Does ice run on atm pes?" : "If do_concurrent_ice is set to .false., ice runs on atm pes.  Else slow ice runs on the ocean pe "
"Where are the outputs?": "If fre is not used, the outputs are written out to the current directory."
"How do I specify where the inputs are?": "You can't.  The INPUT directory is hard coded in FMS"
"Are the grids for atm and land different?": "For GFDL models, they are the same"
"Why are there so many data_override calls?"  : "The original authors DO NOT RECOMMEND exercising the data override capabilities of the FMS coupler until the user has acquired considerable sophistication in running FMS."
"Why are there so many checksum subroutines?"  : "to check for bit-for-bit reproducibility"
"What's different between get_atmos_ice_land_ocean_chksums and get_coupler_chksums?": "get_coupler_chksums only computes a subset of chksums that get_atmos_ice_land_ocean_chksums do"
"How do I turn off checksum computations?": "Can set namelist variables do_chksum and do_endpoint_chksum to .false. to avoid all chksum computation"
"How many different pelists are there?" : "8 pelists:  atm%pelist, ocean%pelist, land%pelist, ice%fast_pelist, ice%slow_pelist, ice%pelist, slow_ice_ocean_pelist, ensemble_pelist"
"What does coupler_set_ice_surface_fields do?": "prepares the sea-ice surface state for the fast atmosphere dynamics.  Also pre-calculate ice radiative properties"
"What does coupler_unpack_ocean_ice_boundary do?": "copies Ocean boundary states into Ice"
"What does coupler_unpack_land_ice_boundary do?": "copies Land_Ice_Boundary files to Ice "
"Where are all the diagnostic fields registered?": "Most fields are registered with diag_field_init in atm_ice_land_flux_exchange_mod "
"How do I add a variable to write out to a file?": "with diag_manager in FMS"
"What is written out in the restarts?": "The coupler only writes out coupler-owned restart files and fields including coupler.res, coupler.intermediate.res, and ocen and ice boundary fields"
"How do I add a variable to write out to a restart file?": "There's not enough information in FMSCoupler for the chatbot to answer reliably"
"Is the exchange grid generated only once?" : "No, the exchange grid is generated everytime with the new ice and land mask"
"What does coupler_atmos_tracer_driver_gather_data do?": "gathers co2, nh3, and tagged/isotopic n3 at the bottom of atm in preparation for flux exchange"
"What does coupler_update_atmos_model_state do?": "Updates the atmospehreic state and diagnostic fields in Atm at the end of one fast loop iteration "
"What is the difference between atmos_ocean_fluxes_calc and atmos_ocean_dep_fluxes_calc?": "atmos_ocean_fluxes_calc handles gas_exchange fluxes.  atmos_ocean_dep_fluxes_calc handles deposition fluxes "
"are ocean and ice on the same grid?": "Yes they are on the same grid"
"Which is most commonly used?  REGRID, REDIST, or DIRECT?": "REDIST (double check)"
"How do I turn off land_flux_to_ice?": "set do_runoff namelist flag to .false. under flux_exchange_mod"
