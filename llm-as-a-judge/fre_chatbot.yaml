How can I use fre make to containerize a model?: '

  Thinking...


  Assistant > **Summary**: To containerize a model using fre make, you need to create
  and configure the required YAML files: Model Yaml, Compile Yaml, and Platforms yaml.


  **Details**:


  1. **Model Yaml**: This file defines the model configuration and is used by fre
  make to generate the necessary scripts and build the model executable or container
  image.

  2. **Compile Yaml**: This file defines the compilation settings for the model and
  is used by fre make to generate the compilation script and Dockerfile (for containerization).

  3. **Platforms yaml**: This file defines the platforms and container configuration,
  including the container engine (e.g., podman or docker) and the base image to use.


  **Required Steps:**


  1. Create a Model Yaml file that defines the model configuration.

  2. Create a Compile Yaml file that defines the compilation settings for the model.

  3. Create a Platforms yaml file that defines the platforms and container configuration.

  4. Run `fre make all` with the necessary flags to generate the checkout script,
  Makefile, Dockerfile, and createContainer.sh script.


  **Example Command:**

  ```bash

  fre make -p <platform> -t <target> all

  ```

  Replace `<platform>` with the platform name defined in the Platforms yaml file,
  and `<target>` with the target name defined in the Model Yaml file.


  **Additional Notes:**


  * Make sure you have access to a container engine (e.g., podman or docker) on your
  system.

  * The Platforms yaml file should define the container configuration, including the
  container engine and base image.

  * If using a two-stage build, ensure that the correct platform and target are specified
  in the Model Yaml file.

  '
What parallelism is available within fre make?: "\nThinking...\n\nAssistant > ###\
  \ **Summary**\nFre make offers several levels of parallelism to optimize compilation\
  \ and checkout processes.\n\n### **Details**\n* **Checkout Script**: Fre make can\
  \ clone multiple git repositories in parallel using the `--git-jobs` flag. This\
  \ flag specifies the number of submodules to clone simultaneously.\n\t+ Example:\
  \ `fre make --checkout-script ... --git-jobs 4`\n* **Makefile Compilation**: For\
  \ bare-metal platforms, fre make compiles component Makefiles in parallel using\
  \ a default or specified value for `MAKE_JOBS`. The `--make-jobs` flag allows users\
  \ to override this setting.\n\t+ Example: `fre make --make-jobs 8`\n* **Compile\
  \ Script Generation**: While the compile script generation itself is not parallelized,\
  \ fre make can execute multiple compile scripts in parallel using the `--parallel`\
  \ flag. This option specifies the number of concurrent compile scripts to run.\n\
  \t+ Example: `fre make --execute ... --parallel 4`\n\n### **Example**\nTo enable\
  \ all available levels of parallelism, use:\n```bash\nfre make --checkout-script\
  \ ... --git-jobs 4 --make-jobs 8 --parallel 4\n```\nNote that the `--execute` flag\
  \ is required to enable parallel compilation.\n"
