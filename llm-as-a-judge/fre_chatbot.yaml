  \ accordingly in the compile yaml.\n"
How do I specify multiple platforms and targets with fre make?: '

  Thinking...


  Assistant > **Summary**

  You can specify multiple platforms and targets using the `-p` flag for platforms
  and the `-t` flag for targets.


  **Details**


  * To specify multiple platforms, use the `-p` flag followed by one or more FRE platform
  strings separated by spaces. For example:


  ```bash

  fre make all -p <platform1> <platform2>

  ```


  * To specify multiple targets, use the `-t` flag followed by one or more mkmf target
  strings separated by spaces. For example:


  ```bash

  fre make all -t <target1> <target2>

  ```


  You can combine these flags to specify multiple platforms and targets together.


  **Example**


  ```bash

  fre make all -p ncrc5.intel23 ncrc5.intel22 -t prod repro

  ```


  This will generate one compile script per platform-target pair, using the specified
  platforms (`ncrc5.intel23` and `ncrc5.intel22`) and targets (`prod` and `repro`).

  '
How does the 'modelRoot' key differ in the bare-metal vs container platforms?: "\n\
  Thinking...\n\nAssistant > **Summary**\nThe `modelRoot` key has different implications\
  \ in bare-metal and container platforms. In bare-metal builds, it's an optional\
  \ parameter that specifies the root directory for model install files. In contrast,\
  \ when building a container image, `modelRoot` is required and defines the root\
  \ directory for model install files inside the container.\n\n**Details**\n\n*  \
  \ **Bare-Metal Builds:**\n    *   `modelRoot` is an optional parameter.\n    * \
  \  It specifies the root directory for model install files.\n    *   Not used when\
  \ `mk_template` is a bare filename (e.g., without a path).\n*   **Container Builds:**\n\
  \    *   `modelRoot` is required.\n    *   Defines the root directory for model\
  \ install files inside the container.\n\n**Example**\n\nTo illustrate this, consider\
  \ an example where you want to build a container image using the following YAML\
  \ configuration:\n\n```yml\nplatforms.yaml:\n  ncrc5.intel23:\n    ...\n    container_addlibs:\
  \ ['darcy']\n    container_build: True\n\ncompile.yaml:\n  modelRoot: /opt/models/\n\
  ```\n\nIn this scenario, `modelRoot` is required for container builds and specifies\
  \ the root directory `/opt/models/` inside the container. If you were building a\
  \ bare-metal executable instead, `modelRoot` would be optional, but its value would\
  \ not affect the compilation process.\n\nThe critical difference lies in how `modelRoot`\
  \ influences the build process:\n\n*   In bare-metal builds, it's primarily used\
  \ to specify where model files are installed.\n*   In container builds, it defines\
  \ a key directory within the container image where model files will be stored.\n"
What is the difference between a one-stage and two-stage build in fre make?: "\nThinking...\n\
  \nAssistant > **Summary**\nThe main difference between a one-stage and two-stage\
  \ build in fre make is that a one-stage build includes the Intel compiler, while\
  \ a two-stage build strips out the Intel compiler and uses a platform-specific base\
  \ container.\n\n**Details**\n\n* **One-stage build:**\n\t+ Contains the Intel compiler\n\
  \t+ Not shareable as it requires an Intel license for distribution\n* **Two-stage\
  \ build:**\n\t+ Includes platform information with a second container base to build\
  \ off of\n\t+ Strips out the Intel compiler, reducing the size of the container\
  \ and making it shareable and easier to store\n\n### Example CLI Command\nTo perform\
  \ a two-stage build using the `fre make` subtool, specify the right platform with\
  \ the `-p` flag:\n```bash\ncode fre/make $ make -p [platform] ... # use platform\
  \ specified in platforms.yaml for one or two stage builds\n```\nIn the above example,\
  \ `[platform]` should be replaced with a specific value such as `container_base`.\n"
