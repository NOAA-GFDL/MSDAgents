how do i use a data_table.yaml?: 'To use a `data_table.yaml`, you need to call the
  `read_table_yaml` subroutine, passing in the contents of the `data_table.yaml` file
  as an argument.


  Here''s an example:

  ```fortran

  use fms_data_override


  ! Assume ''data_table'' is a structure containing the data_table.yaml contents

  call read_table_yaml(data_table%data_table)

  ```

  This will read the contents of the `data_table.yaml` file and populate the `data_table`
  structure.


  Note that you need to have the `DATA_OVERRIDE` namelist flag set to `.true.` for
  this to work. You can do this by adding the following line to your executable''s
  namelist:

  ```fortran

  use_data_table_yaml = .true.

  ```

  Alternatively, if you want to use the new `use_data_table_yaml` namelist flag, you
  can set it like this:

  ```fortran

  use_data_table_yaml = .true.  ! or .false.

  ```'
