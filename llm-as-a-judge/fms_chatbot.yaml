what namelist options are available for diag_manager: 'The following namelist options
  are available for `diag_manager`:


  1. `diag_manager_nml`: This namelist option controls the diag manager settings.

  2. `use_modern_diag`: A logical variable that enables or disables the modern diag
  manager code. Default is `.false.`.

  3. `flush_nc_files`: Not yet functional.

  4. `mix_snapshot_average_fields`: Not yet functional and planned to be deprecated
  for the rewritten diag_manager only.

  5. `use_refactored_send`: Enables or disables the refactored send_data routines.
  Default is `.false.`.


  Additionally, the following namelist options are available in `fms2_io_nml`:


  1. `deflate_level`: Sets the deflate level for netcdf output.

  2. `shuffle_netcdf`: Shuffles the data before writing it to netcdf files.

  3. `register_unlimited_dimensions`: Registers dimensions as unlimited compressed.


  Note that these options may not be available in all FMS versions or configurations.'
what does horiz_interp do and why?: 'I don''t have enough information from the indexed
  FMS docs to provide a detailed answer about what `horiz_interp` does and why.


  However, I can tell you that `horiz_interp_type` is a data structure that holds
  metadata for horizontal interpolations. The subroutines in the `horiz_interp_read_weights`
  module are used to read weight files and fill in this type instead of calculating
  it manually.


  If you''re looking for information on how `horiz_interp` itself works, I would recommend
  checking out the documentation for the specific routines that make up `horiz_interp`,
  such as `horiz_interp_base_2d_r4` or `horiz_interp_conserve_version1_r8`. These
  routines likely perform some kind of interpolation operation.


  If you have any more information about what `horiz_interp` is supposed to do, I
  may be able to provide a more specific answer.'
how to do horizontal interpolation using FMS?: "To perform horizontal interpolation\
  \ using FMS, you can use the `horiz_interp` subroutine. \n\nThere are two forms\
  \ of this interface:\n\n1. Form A: This requires first calling `horiz_interp_new`,\
  \ which returns a derived-type variable containing interpolation indices and weights.\n\
  \n2. Form B: This does not require any initialization and is more concise but less\
  \ flexible than form A.\n\nHere's an example using form A:\n```fortran\ncall horiz_interp_new(interp,\
  \ npt, xgrid1, ygrid1, xgrid2, ygrid2)\n```\nAnd here's an example using form B:\n\
  ```fortran\ncall horiz_interp(xgrid1, ygrid1, xgrid2, ygrid2, interp, data_in, verbose)\n\
  ```\nNote that in both cases, `xgrid1`, `ygrid1`, `xgrid2`, and `ygrid2` are the\
  \ input grids for the horizontal interpolation, `interp` is a derived-type variable\
  \ containing interpolation indices and weights, `data_in` is the input data on the\
  \ source grid, and `verbose` is an optional argument that can be used to control\
  \ the verbosity of the subroutine.\n\nAlso note that you need to specify the type\
  \ of interpolation method using the `interp` variable. For example, you can use\
  \ `INTERP_BICUBIC` for bicubic interpolation or `INTERP_LINEAR` for linear interpolation.\n\
  \nYou can also use the `horiz_interp_bicubic_r4` and `horiz_interp_bicubic_r8` subroutines\
  \ from the `horiz_interp_bicubic` module, which perform bicubic horizontal interpolation."
How do I remap data using bilinear interpolation?: "You can use the `horiz_interp_bilinear_new`\
  \ subroutine to perform bilinear interpolation.\n\n```fortran\ncall horiz_interp_bilinear_new(\n\
  \  Interp = interpolate_r4_type, \n  data_in = data_out, \n  data_out = data_in,\
  \ \n  verbose = 0, \n  mask_in = mask_out, \n  mask_out = mask_in, \n  missing_value\
  \ = missing_permit, \n  missing_permit = numbers_of_points_allowed_to_miss_for_bilinear_interpolation)\n\
  ```\n\nHowever, note that the order of `data_in` and `data_out` is swapped in your\
  \ call. The correct order should be:\n\n```fortran\ncall horiz_interp_bilinear_new(\n\
  \  Interp = interpolate_r4_type, \n  data_in = data_in, \n  data_out = data_out,\
  \ \n  verbose = 0, \n  mask_in = mask_out, \n  mask_out = mask_in, \n  missing_value\
  \ = missing_permit, \n  missing_permit = numbers_of_points_allowed_to_miss_for_bilinear_interpolation)\n\
  ```"
How do I remap data with conservative interpolation?: 'You can use the `xgrid_init`
  subroutine with the `remap_method` argument set to `FIRST_ORDER` for conservative
  interpolation.


  ```fortran

  call xgrid_init(remap_method=FIRST_ORDER)

  ```


  This will initialize the exchange grid interpolation method using the first-order
  conservative remapping scheme.'
How do I remap data with bicubic interpolation?: 'You can use the `horiz_interp_bicubic`
  subroutine to perform bicubic horizontal interpolation, which is a method for remapping
  data from one grid to another.


  Here''s an example of how you might call this subroutine:


  ```fortran

  call horiz_interp_bicubic_r4(lon_in, lat_in, lon_out, lat_out, .true., src_modulo.interp)

  ```


  In this example, `lon_in` and `lat_in` are the input longitude and latitude grids,
  respectively, while `lon_out` and `lat_out` are the output longitude and latitude
  grids. The `.true.` argument indicates that you want to use bicubic interpolation.


  Note that you need to allocate the `wtj` variable before calling this subroutine:


  ```fortran

  allocate(wtj(r4_kind, r4_kind, 2))

