How do I open a file with fms2_io?: 'To open a file using `fms2_io`, you can use the
  `open_file` routine. Here''s an example:


  ```fortran

  io_success = open_file(fileobj, "filename", mode="write")

  ```


  In this example, `fileobj` is the object that will be used to manage the file, and
  `"filename"` is the name of the file you want to open.


  You can also specify additional arguments, such as:


  *   `dont_add_res_to_filename`: If `.true.`, the filename will not be modified (default
  behavior adds `.res` to restart file names).

  *   `domain`: If specified, this indicates that the file is a domain decomposed
  data file.


  Here''s an example with these additional arguments:


  ```fortran

  io_success = open_file(fileobj, "filename", mode="write", dont_add_res_to_filename=.true.)

  ```


  Note: The `mode` argument can be `"read"`, `"write"`, `"overwrite"`, or `"append"`.


  Also note that you need to explicitly call the constructor (i.e., `open_file`) for
  each file object, and close it when you''re done with it using the corresponding
  destructor (`close_file`).'
Should i use diskless IO methods?: 'I don''t have enough information from the indexed
  FMS docs to provide a definitive answer. However, I can suggest that you consider
  using diskless IO methods if:


  * You are working with large files and want to improve performance by reducing disk
  I/O.

  * You are running on a system with limited disk space or high disk I/O latency.

  * You need to reduce the overhead of disk I/O operations.


  If you''re unsure, you can start by checking the documentation for FMS2_IO and netcdf_io_mod
  to see if there are any recommendations or guidelines for using diskless IO methods.'
How do I open a file for a unstructured grid with fms2_io?: "To open a file for an\
  \ unstructured grid using `fms2_io`, you would use the `open_unstructured_domain_file`\
  \ routine. \n\nHere's how to call it:\n\n```fortran\nio_success = open_unstructured_domain_file(fileobj,\
  \ \"filename\", \"write\")\n```\n\nThis will create a new file object that can be\
  \ used for writing data on an unstructured grid domain.\n\nNote: Before using `open_unstructured_domain_file`,\
  \ you need to register the axes of your unstructured grid using the `register_axis`\
  \ procedure. This is not shown in this example, but it's necessary to inform `fms2_io`\
  \ which dimensions correspond to the unstructured grid."
How can I use netcdf collective IO?: 'To use NetCDF collective IO, you need to enable
  the `use_collective` flag when opening a file using the `open_file` routine from
  the `fms2_io` module.


  Here''s an example:

  ```fortran

  use fms2_io


  ! Create a new netcdf file object

  fileobj = open_file(file="test_collective_io.nc", mode="read", domain=domain, use_collective=.true.)

  ```

  In this example, we create a new `fmsnetcdffile_t` object using the `open_file`
  routine with the `use_collective` flag set to `.true.`. This will enable collective
  IO for the file.


  Note that you need to have HDF5 and NetCDF libraries built with MPI support to use
  collective IO.


  Also, keep in mind that collective IO can be slower than sequential IO due to the
  overhead of communicating between processors. You should only use collective IO
  when it is necessary for your specific use case.'
How can I control how many pes write/read?: "You can use the `read_all_pe` subroutine\
  \ to control how many processors (PEs) read or write data.\n\nThe `read_all_pe`\
  \ subroutine is used to read global data on all processors extracting local part\
  \ needed (TRUE) or read global data on PE0 and broadcast to all PEs(FALSE). \n\n\
  To control how many PEs write/read, you can use the `read_data` subroutine with\
  \ the `nt` argument set to a specific value. The `nt` argument specifies the index\
  \ of the time slice of the climatology that you wish to read.\n\nFor example, if\
  \ you want to read data from all processors, you can call `read_data` with `nt =\
  \ 0`, which means \"all time slices\". If you want to read data only from PE0 and\
  \ broadcast it to all PEs, you can call `read_data` with `nt = -1`, which means\
  \ \"all time slices but last one\".\n\nHere is an example of how to use the `read_data`\
  \ subroutine:\n```fortran\ncall read_data(clim_type, 'field_name', data, 0, i, Time)\n\
  ```\nThis will read all available time slices from the file and write them onto\
  \ the `data` array.\n\nNote that you should replace `'field_name'`, `clim_type`,\
  \ `data`, `i`, and `Time` with your actual field name, climatology type, data array,\
  \ index variable, and time variable, respectively."
how to enable other netcdf library features (chunking, version, compression): "To\
  \ enable other NetCDF library features such as chunking, version, and compression,\
  \ you can use the following options in the `fms2_io_nml` namelist:\n\n- To enable\
  \ chunking, specify the `netcdf_default_format` option with a value of `\"netcdf4\"\
  ` and set the `chksz` variable to a comma-separated list of five integers representing\
  \ the desired chunk sizes for each dimension.\n- To use a specific NetCDF version,\
  \ you can set the `netcdf_default_format` option to `\"class\"` or `\"64bit\"`.\
  \ However, note that only `\"64bit\"` is currently supported in FMS2_IO.\n- To enable\
  \ compression, specify the `deflate_level` variable. The value of this variable\
  \ should be an integer between 1 and 9.\n\nHere's an example of how you can set\
  \ these options in the `fms2_io_nml` namelist:\n\n```fortran\n& fms2_io\n  netcdf_default_format\
  \ = \"netcdf4\"\n  chksz = \"100,200,300,400,500\"\n  deflate_level = 6\n  shuffle\
  \ = .true.\n/\n```\n\nIn this example, the NetCDF file will be created in `\"netcdf4\"\
  ` format with chunk sizes of 100, 200, 300, 400, and 500 bytes for each dimension.\
  \ The compression level is set to 6.\n\nNote that you should adjust the `chksz`\
  \ variable according to your specific needs, as it represents a comma-separated\
  \ list of five integers representing the desired chunk sizes for each dimension."
how to register an axis/dimension: "To register an axis or dimension in FMS, you can\
  \ use the `register_domain_decomposed_dimension` subroutine.\n\nHere is a basic\
  \ example of how to call this subroutine:\n\n```fortran\ncall register_domain_decomposed_dimension(\n\
  \  fileobj = 'my_file',\n  dim_name = 'x_dim',\n  xory = 'x', \n  domain_position\
  \ = domain_position)\n```\n\nIn this example, `fileobj` should be the name of a\
  \ file object that has been previously opened and associated with the FMS model.\
  \ The `dim_name` argument is the name given to the dimension in the FMS model, and\
  \ `xory` specifies whether the dimension is associated with the \"x\" or \"y\" axis\
  \ of the 2D domain.\n\nPlease note that you need to have a valid file object and\
  \ a valid domain position before calling this subroutine."
how to register an field/variable: "To register a field/variable in FMS, you need\
  \ to call the `register` routine.\n\nHere is an example:\n```fortran\ncall register(variable_name\
  \ = 'my_variable', \n              standard_name = 'standard_name_for_my_variable',\
  \ \n              may_init = .true., \n              file_duration_units = 'seconds')\n\
  ```\nIn this example, we are registering a variable named \"my_variable\" with the\
  \ standard name \"standard_name_for_my_variable\". The `may_init` parameter is set\
  \ to `.true.` to indicate that the field can be initialized internally if it cannot\
  \ be read from a restart file. The `file_duration_units` parameter is also provided,\
  \ which is required when this parameter is present.\n\nNote: You need to replace\
  \ `'my_variable'`, `'standard_name_for_my_variable'`, and `'seconds'` with your\
  \ actual variable name, standard name, and file duration units respectively."
how to close a file: "To close a file in FMS, you can use the `close_file` routine.\
  \ \n\nExample:\n```fortran\ncall close_file(fileobj)\n```\nThis will close the file\
  \ object `fileobj`."
how to write an unlimited axis/dimension: 'To write an unlimited axis/dimension in
  FMS, you can use the `get_unlimited_dimension_name` subroutine.


  Here''s how you can do it:


  ```fortran

  call get_unlimited_dimension_name(fileobj, unlim_dimension_level, broadcast=.true.)

  ```


  In this code:


  - `fileobj` is a file object.

  - `unlim_dimension_level` is the unlimited dimension level currently being written
  (an integer variable).

  - `broadcast=.true.` means that the data will be broadcasted to non "I/O root" ranks.
  If you want to control whether or not the data will be broadcasted, you can set
  this argument to `.false.`.


  This subroutine returns a string representing the name of the unlimited dimension.'
what namelist options are available for the fms2_io?: 'The FMS2_IO module has several
  namelist options available:


  1. `header_buffer_val`: sets the netcdf header size in bytes (default value is 16kb)

  2. `netcdf_default_format`: allows the user to change the netcdf file type (default
  value is 64bit)

  3. `enable_data_compression`: enables data compression for netcdf output

  4. `enable_chunking`: enables chunking for netcdf output


  Additionally, there are options available in the `register_restart_field` routine:


  1. `enable_data_compression`

  2. `enable_chunking`


  Please note that these options can be adjusted according to the specific requirements
  of your climate simulation model.'
how to use the diag_manager: 'To use the `diag_manager`, you need to follow these
  steps:


  1. Create a `diag_table` as described in the `diag_table_mod` documentation.


  2. Call `diag_manager_init` to initialize the `diag_manager_mod`.


  3. Register all fields from the `diag_table` using `register_diag_field` before
  calling `send_data`.


  4. Call `send_data` to send data to output fields.


  5. Finally, call `diag_manager_end` to exit the `diag_manager`.


  Here is an example of how you can use the `diag_manager`:


  ```fortran

  use diag_manager_mod


  ! Create a diag_table

  call fms_diag_yaml_mod%create_diag_table(''diag_table.yaml'')


  ! Initialize diag_manager

  call diag_manager_init()


  ! Register all fields from diag_table

  call register_diag_field(diag_table%fields(1)%name, diag_table%fields(1)%type)

  call register_diag_field(diag_table%fields(2)%name, diag_table%fields(2)%type)


  ! Send data to output fields

  call send_data()


  ! Exit diag_manager

  call diag_manager_end()

  ```


  Note that you need to replace `''diag_table.yaml''` with the actual path to your
  `diag_table.yaml` file.


  Also, make sure to include all fields from the `diag_table` in the `register_diag_field`
  calls before calling `send_data`.'
how to enable the modern_diag manager: "To enable the modern diag manager, you need\
  \ to set the `use_modern_diag` namelist variable to `.true.` in your `diag_manager_nml`.\
  \ \n\nHere is an example of how to do this:\n\n```fortran\n! diag_manager_nml\n\
  !\n! Namelist for diag_manager\n!\n! use_modern_diag = .true.  ! Enable modern diag\
  \ manager\n!\n! Other diag manager namelists...\n```\n\nBy setting `use_modern_diag`\
  \ to `.true.`, you will enable the modern diag manager and its features, such as\
  \ self-describing YAML formatting for diag_table's, support for 4d variables, subregions\
  \ with indices, and more flexibility when adding metadata and defining output frequency."
how would i get <insert diagnostic here> to output via my diag_table.yaml?: "To add\
  \ a specific diagnostic to your `diag_table.yaml`, you need to follow the YAML format\
  \ specified in the documentation.\n\nFor example, let's say you want to add a diagnostic\
  \ called \"temperature\" that outputs temperature on a 4D variable. The corresponding\
  \ section in your `diag_table.yaml` would look like this:\n```yaml\n- name: temperature\n\
  \  type: type(diag_object_type), target, public variable\n  description: Temperature\
  \ diagnostic\n\n  [1. Converting from legacy ascii diag_table format](diag_yaml_format.md#1-converting-from-legacy-ascii-diag_table-format)\n\
  \  - diag_unit: 1\n    - name: temperature_4d\n      type: type(diag_object_type),\
  \ target, public variable\n      description: Temperature on 4D variable\n\n  [2.\
  \ Diag table yaml sections](diag_yaml_format.md#2-diag-table-yaml-sections)\n  -\
  \ diag_unit: 1\n    - name: temperature_2d\n      type: type(diag_object_type),\
  \ target, public variable\n      description: Temperature on 2D variable\n\n  [2.1\
  \ Global Section](diag_yaml_format.md#21-global-section)\n  - diag_unit: 1\n   \
  \ - name: temperature_global\n      type: type(diag_object_type), target, public\
  \ variable\n      description: Global temperature diagnostic\n\n  [2.2 File Section](diag_yaml_format.md#22-file-section)\n\
  \  - diag_unit: 1\n    - name: temperature_file\n      type: type(diag_object_type),\
  \ target, public variable\n      description: Temperature on file output\n```\n\
  In this example, we have three diagnostics: `temperature_4d`, `temperature_2d`,\
  \ and `temperature_global`. The first one is a 4D variable diagnostic, the second\
  \ one is a 2D variable diagnostic, and the third one is a global diagnostic.\n\n\
  To enable these diagnostics in your code, you need to call the `diag_manager` subroutine\
  \ with the corresponding arguments. For example:\n```fortran\ncall diag_manager(\n\
  \  module='my_module',\n  diag_unit=1,\n  Time=time,\n  nn=0,\n  diag_lon=lon,\n\
  \  diag_lat=lat,\n  diag_i=i,\n  diag_j=j)\n```\nThis will call the `diag_manager`\
  \ subroutine with the first diagnostic in the list, which is `temperature_4d`. You\
  \ can change the arguments to enable different diagnostics.\n\nNote that you need\
  \ to use the `diag_yaml_object` variable to access the YAML data and parse it into\
  \ a format that can be used by the `diag_manager` subroutine."
what reduction methods are available: 'The reduction methods available in FMS_diag_reduction_methods_mod
  are:


  1. Average (time_average)

  2. Diurnal (diurnalXX, where XX is the number of diurnal samples)

  3. Power (powXX, where XX is the power level)

  4. Minimum (time_min)

  5. Maximum (time_max)

  6. Root Mean Square (rms) (time_rms)

  7. Sum (time_sum)


  These reduction methods can be used for various variables in FMS simulations.'
how to write files using wildcard file names: 'You can use the `FMS_IO:file_name`
  interface to open files with wildcard names.


  Here''s an example:


  ```fortran

  character(len=fms_file_len) :: file_name

  character(len=fms_file_len) :: pattern = ''*.*''


  call FMS_IO:open(file_name, new_unit=io_unit, status=''old'', action=''read'', pattern=pattern)

  ```


  In this example, `file_name` is the output file name without the trailing ".nc",
  and `pattern` is a wildcard pattern that matches all files. The `FMS_IO:open` interface
  opens the first matching file.


  If you want to open multiple files with different patterns, you can use an array
  of character variables:


  ```fortran

  character(len=fms_file_len) :: file_name1

  character(len=fms_file_len) :: file_name2


  character(len=128) :: pattern1 = ''*.*''

  character(len=128) :: pattern2 = ''data*.nc''


  call FMS_IO:open(file_name1, new_unit=io_unit1, status=''old'', action=''read'',
  pattern=pattern1)

  call FMS_IO:open(file_name2, new_unit=io_unit2, status=''old'', action=''read'',
  pattern=pattern2)

  ```


  Note that the `FMS_IO:open` interface returns a file ID for each open file. You
  can use these IDs to read and write data from the files.


  Also note that the `pattern` argument in the `FMS_IO:open` interface is not exactly
  a wildcard pattern, but rather a string that specifies how to match the file name.
  The supported patterns are:


  * `*`: matches any characters

  * `%`: matches any single character

  * `?`: matches any single character (equivalent to `%`)

  * `.`: matches any single character (equivalent to `%`)


  You can combine these patterns using the usual shell syntax, such as `*.nc` or `data%.*`.'
how to use subregional output: "To use subregional output in FMS, you need to define\
  \ a subregion that captures a specific subsection of the block. Here's an example\
  \ of how to do it:\n\n```fortran\n! Define the subregion\nsub_region = [1, 2, 3,\
  \ 4] ! start and end indices for each dimension\n\n! Set the file name for the subregional\
  \ output\nfile_sub_region = \"subregional_output\"\n\n! Determine if a block is\
  \ in the subregion\nif (determine_if_block_is_in_region(sub_region, [1, 2, 3, 4],\
  \ bounds)) then\n    ! Write data to file\n    write_on_this_pe = .true.\nelse\n\
  \    ! Do not write data to file\n    write_on_this_pe = .false.\nend if\n\n! Set\
  \ the output frequency and units\noutput_freq = 10 ! Output every 10 seconds\noutput_units\
  \ = \"seconds\"\n\n! Open the file for writing\nopen (unit=10, file=file_sub_region,\
  \ status=\"replace\")\n```\n\nIn this example, we define a subregion that captures\
  \ the first four indices of each dimension. We then use the `determine_if_block_is_in_region`\
  \ function to check if a block is in the subregion. If it is, we set `write_on_this_pe`\
  \ to `.true.` and write data to file; otherwise, we set it to `.false.`.\n\nNote\
  \ that you need to define the `sub_region` variable as an array of integers, where\
  \ each integer represents the start or end index for a dimension. The `determine_if_block_is_in_region`\
  \ function takes this subregion array as its first argument, along with the bounds\
  \ and dimension arrays.\n\nAlso, make sure to set the `is_subregional` attribute\
  \ to `.true.` for non-global history files using the `file_sub_region` variable:\n\
  \n```fortran\nfile_sub_region%is_subregional = .true.\n```\n\nThis will allow FMS\
  \ to correctly identify subregional output and write it to separate files."
how to exclude files from output: 'I don''t have enough information from the indexed
