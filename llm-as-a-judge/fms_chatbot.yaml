How do I remap data with spherical interpolation?: "You can use the `horiz_interp_spherical_new_r8`\
  \ subroutine to perform spherical regridding (also known as spherical interpolation).\
  \ This subroutine takes as arguments:\n\n- `data_in`: Input data on source grid.\n\
  - `data_out`: Output data on destination grid.\n- `verbose`: Verbosity level, where\
  \ 0 = no output, 1 = min,max,means; 2 = most output.\n- `mask_in`: Input mask, must\
  \ be the same size as the input data.\n- `mask_out`: Optional output mask field\
  \ to show where output data exists.\n\nNote that you need to create a derived type\
  \ variable containing indices and weights for subsequent interpolations using the\
  \ `missing_value.interp` argument returned by a previous call to `horiz_interp_spherical_new_r8`.\
  \ \n\nHere is an example of how to use this subroutine:\n\n```fortran\ntype :: interp_type\n\
  \    integer :: i_lon(:,:,:), missing_value.interp(:)\ncontains\nend type interp_type\n\
  \ntype(interp_type) :: interp\n\ncall horiz_interp_spherical_new_r8(data_in, data_out,\
  \ 2, mask_in, interp%missing_value.interp)\n\n! Use the derived type variable for\
  \ further processing or output\n```\n\nAlso note that you need to initialize `mask_out`\
