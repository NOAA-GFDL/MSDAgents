'how to use the time_types ': "To use the `time_type`, you can call the `set_time`\
  \ function with the desired parameters.\n\nHere is an example of how to create two\
  \ `time_type` variables:\n\n```fortran\ntype(time_type):: time1, time2\n\ncall set_time(seconds=3600.,\
  \ days=0., ticks=0., err_msg='Error')\ntime1 = time1\n\ncall set_time(date_string='10043200',\
  \ err_msg='Error', allow_rounding=.true.)\ntime2 = time2\n```\n\nIn the above example,\
  \ `time1` is created with a duration of 1 second, and `time2` is created from a\
  \ date string. The `allow_rounding` argument in the `set_time` function for `time2`\
  \ allows the date string to be rounded to the nearest valid time.\n\nYou can also\
  \ use the `time_gt` operator to compare two `time_type` variables:\n\n```fortran\n\
  if (time1 > time2) then\n    print *, 'time1 is greater than time2'\nelse if (time1\
  \ == time2) then\n    print *, 'time1 is equal to time2'\nelse\n    print *, 'time1\
  \ is less than time2'\nend if\n```\n\nNote that the `set_time` function returns\
  \ the created `time_type` variable, so you can assign it directly to a new variable."
