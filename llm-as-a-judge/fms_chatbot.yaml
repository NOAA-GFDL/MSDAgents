how to convert between legacy and yaml field tables: 'To convert between legacy and
  YAML field tables, you can use the python script [**diag_table_to_yaml.py**](https://github.com/NOAA-GFDL/fms_yaml_tools/blob/aafc3293d45df2fc173d3c7afd8b8b0adc18fde4/fms_yaml_tools/diag_table/diag_table_to_yaml.py#L23-L26)
  provided by the FMS community.


  This script can be used to convert a legacy ascii diag_table format to the new YAML
  format. The conversion process involves reading the legacy diag_table, parsing its
  contents, and generating the corresponding YAML structure.


  Here''s an example of how you might use this script in your Fortran code:


  ```fortran

  use diag_yaml_format


  ! Convert diag_table.yaml to legacy diag_table format

  call diag_table_to_legacy(diag_table)


  ! Convert legacy diag_table to diag_table.yaml format

  call diag_table_to_yaml(diag_table, diag_table_yaml)

  ```


  In the above example, `diag_table` is a variable of type `diag_table_t`, and `diag_table_yaml`
  is a variable of type `yaml_diag_table_t`. The `diag_table_to_legacy` procedure
  converts `diag_table` to the legacy ascii format, while the `diag_table_to_yaml`
  procedure does the reverse.


  Note that you will need to link against the FMS library with yaml support when compiling
  your executable. This can be done using the `-Duse_yaml` preprocessor flag.


  Alternatively, if you want to convert between YAML and legacy field tables directly
  in Fortran, you would need to implement this conversion logic yourself. However,
  this is not a straightforward task, as it requires parsing and generating YAML data
  structures from the legacy ascii format.


  It''s worth noting that the FMS community provides tools like `diag_table_to_yaml.py`
  to simplify this process, but implementing the conversion logic directly in Fortran
  can be challenging without additional support or guidance.'
how are times managed in FMS?: 'In FMS, time management is handled through the `time_manager`
  module. This module provides a single defined type, `time_type`, which represents
  an interval of time and can be thought of as representing the number of seconds
  in some time interval.


  The `time_type` is used to store time and date quantities, and it can be mapped
  to a date under a given calendar definition by using it to represent the time that
  has passed since some base date.


  Additionally, FMS provides interfaces for operating on `time_type` values, such
  as conversion between different units of time (e.g., seconds, days, years) and calculation
  of time intervals.


  It''s worth noting that FMS does not currently support 3D diurnal diagnostic variables.'
