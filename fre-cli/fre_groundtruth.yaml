"What can I do with my fre-cli generated catalog?": "You can ingest your catalog with Intake-ESM and perform advanced analysis on your files."
"What is fre catalog?" : "Fre catalog is a fre-cli subtool wrapper for the GFDL catalog builder, a “python community package ecosystem” that allows users to generate data catalogs compatible with intake-esm. "
"What is intake-esm?": "A data cataloging utility built on top of intake, pandas, polars and xarray."
"How do I create a data catalog?" : "You can generate a data catalog with fre catalog build <input path> <output filename>"
"What kind of data is in the catalog?" : "The data catalog contains post-processed datasets."
"What is catalog validation?": "Catalogs are validated using the the comprehensive validator tool. This tool can validate vocabulary metadata in catalogs against community controlled vocabularies (--vocab) or validate the catalogs have been generated without empty values. (--proper_generation)"
"What happens if the catalog validation fails?": "If validation fails, the user should check their configurations."
"Can I use the catalog builder on any set of NetCDF files  like the raw output files from model runs?": "No, the Catalog Builder works primarily with post-processed files."
"What kind of output does the catalog builder produce?": "The GFDL Catalog Builder produces a CSV catalog and a JSON specification file for use with Intake-ESM."
"How do I configure a catalog?": "You can create a custom configuration for the catalog builder by"
"What information can I list from the yaml configuration files?": "Users can list experiments defined in the model yaml, platforms defined in the platforms.yaml, and components to be post-procfessed, defined in the pp yamls"
"How can I list the experiments defined in the yaml?": "fre list exps -y [model.yaml]"
"How can I list the platforms available in the yaml?": "fre list platforms -y [model.yaml]"
"What command can I use to compile a model?": "The fre make all command can be used to compile a model. (not sure if we should have more info here about bare-metal vs container model builds...)"
"How can I compile a model?": "To compile a model, the command fre make all -y [model yaml] -p [platform] -t [target] can be used with the flag --execute"
"How can I use fre make to containerize a model?": "The command fre make all can be used to create a model container build by specifically passing in a container platform (defined in the platforms.yaml)."
"What parallelism is available within fre make?": "fre make can support cloning multiple git submodules simultaneously (--git-jobs), executing concurrent compile scripts (--nparallel), multiple make recipes to compile in parallel (--make-jobs), and checking out compile components in parallel."
"What is the difference between --makejobs and --gitjobs (in fre make)?": "--makejobs refers to the number of make recipes to compile in parallel. (optional) (default 4) , while --gitjobs refers to the number of git submodules to clone simultaneously. (optional) (default 4)"
"What is the difference between the 'container_addlibs' and 'baremetal_linkerflags' keys set in the compile yaml?": "container_addlibs refers to libraries and packages needed for linking in the container, where baremetal_linkerflags refers to linker flags of libraries and packages needed for linking in the bare-metal build"
"How do I specify multiple platforms and targets with fre make?": "To specify multiple platforms and targets, define multiple -p and -t options. For example fre make all -y [model yaml] -p ncrc5.intel23 -p hpcme.intel2025 -t debug -t prod-openmp"
"How does the 'modelRoot' key differ in the bare-metal vs container platforms?": "For bare-metal build, the 'modelRoot' key refers to the output location on the local system. For the container build, the 'modelRoot' location in the build/src location INSIDE of the container"
"What is the difference between a one-stage and two-stage build in fre make?": "The two-stage build strips out the intel compiler and reduces the overall size of the container to make it shareable"
"Which targets are mutually exclusive?": "Mutually exclusive targets include debug, prod, and repro"
"What is the default behavior of fre make checkout when the checked out source code already exists?": "If checked out source code already exists, the default behavior of fre make checkout will cause an error (list error message) unless --force-checkout is specified."
"Is the model code frozen in a container?/Can I edit the model code in a container?": "The model code is frozen in the container once it's built. Users cannot edit the model code in the container unless running the container interactively. Even when running interactively, edits will not be saved upon exiting the container."
"Where can I build model containers on gaea?": "Containers are supposed to be built in /tmp/containers/$USER"
"What command can I use to run post-processing?": "The command 'fre pp all' can be used to run post-processing (give example?)"
"How can I trigger certain years to re-run in post-processing experiments?": "The command 'fre pp trigger' can be used to trigger certain years in a post-processing workflow"
"What are refine diag scripts in the post-processing workflow?": "Refine diag scripts are plug-in, user-defined scripts that can be run in the post-processing workflow. The paths to these scripts can be defined in the postprocessing settings yaml."
"How are platforms used in a cylc workflow?": "For a cylc workflow, platforms are defined in the global.cylc site configuration file (set on thecylc install system level) and includes, but is not limited to, information such as the job runner (background or slurm), the cylc installation path, installation directories, and host name."
"How can I define which workflow I want to use for postprocessing?": "(Not really a thing yet)"
"How are yaml files combined?": "The command 'fre yamltools combine-yamls' can be used to combine YAML configurations depending on the use case. Notably, users can pass in '--use compile' to combine YAMLs for use in compilation, or '--use pp', for use in postprocessing."
"How can I combine yaml files for an end-to-end model run?": "(Not really a thing yet)"
"How can I combine yaml files for the compilation process?": "The command 'fre yamltools combine-yamls -y [model yaml] -p [platform] -t [target] --use compile' can be used to combine yaml files for the compilation process"
"How can I combine yaml files for the post-processing run?": "The command 'fre yamltools combine-yamls -y [model yaml] -e [experiment name] -p [platform] -t [target] --use postprocess' can be used to combine yaml files for the compilation process"
"What is fre-cli?": "The fre-cli is the next generation command line interface for FRE (FMS Runtime Environment). Tools in the fre-cli follow a 'program TOOL SUBTOOL' structure, to enhance modularity. The tools are written in python to promote modernization and ease of use."
"How do I set up a fre-cli environment?": "The fre-cli is readily available conda package on the NOAA-GFDL anaconda channel.  To set up a fre-cli conda environment, ensure that conda or mamba is available and run 'conda install noaa-gfdl::fre-cli'"
"How can I containerize the fre-cli?": "In order to containerize the fre-cli, use the files in the container-files directory in the fre-cli repository. Following the README, clone the repository, navgiate into container-files, run podman build to build a container image, run podman save to save the image to a local .tar file, and run apptainer build to create a singularity image file (.sif) from the .tar file."
"How can I use a containerized fre-cli?/What is the set-up?": "(this is low key being updated atm)"
"What is the model YAML?/What makes up a model YAML?": "The model YAML is a configuration file that defines reusable variables for, and includes paths to other YAML configuration files such as the compile, platforms, settings, postprocessing, analysis, and cmor YAMLs."
"What platforms are in this yaml file?": "(Going to use fre-examples platforms.yaml) Platforms defined include 'ncrc5.intel23', 'ncrc6.intel23', 'hpcme.intel25', 'ci.gnu', and 'amd.inteloneapi'"
"Why do we want to combine the yaml configuration files for FRE processes?": "We want to combine the yaml configuration files for FRE processes in order to effectively use YAML anchors and reusable variables in the model.yaml across other yaml files that use them (could be better)"
"How is the resolved yaml file validated?": "The resolved YAML configuration file is validated against a JSON schema hosted in the gfdl_msd_schemas repository"
"What does FRE use to validate the yamls?": "FRE uses the MSD-owned JSON schema files, located in the gfdl_msd_schema repository to validate the combines, resolved YAML file"
"What are the required keys that make up a combined, compile YAML?": "Required keys that make up a combined, compile YAML include 'name' and 'compiler'"
"What are the required keys that make up a combined, post-processing YAML?": "Required keys that make up a combined, post-processing YAML include: name, platform, target, directories, postprocess, history_dir, pp_dir, ptmp_dir, history_segment, site, pp_chunks, pp_start, pp_stop, pp_grid_spec, clean_work, do_atmos_plevel_masking ..."
